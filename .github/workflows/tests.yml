name: tests

# Valida o domínio financeiro e a qualidade do código antes do merge.

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gestao_financeira_familiar
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gestao_financeira_familiar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: gestao_financeira_familiar
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run financial feature tests
        run: |
          php artisan test tests/Feature/FinancialImportAutoDetectionTest.php
          php artisan test tests/Feature/FinancialAccountTest.php
          php artisan test tests/Feature/OfxImportTest.php
          php artisan test tests/Feature/CardStatementImportTest.php
          php artisan test tests/Feature/CreditCardInvoicePaymentReconciliationTest.php
          php artisan test tests/Feature/ExpenseRefundTest.php
          php artisan test tests/Feature/FinancialEntryTest.php
          php artisan test tests/Feature/CreditCardInvoiceTest.php
          php artisan test tests/Feature/FinancialRecurrenceTest.php
          php artisan test tests/Feature/DashboardTest.php

      - name: Run scoped category tests
        run: php artisan test tests/Feature/FinancialTransactionCategoryUpdateTest.php

      - name: Run scoped PHP style
        if: always()
        run: |
          ./vendor/bin/pint --test app/Services/Finance/FinancialEntryService.php app/Http/Controllers/FinancialTransactionController.php app/Http/Controllers/FinancialTransactionCategoryController.php app/Http/Requests/UpdateFinancialTransactionCategoryRequest.php routes/web.php tests/Feature/FinancialTransactionCategoryUpdateTest.php

      - name: Run frontend typecheck
        if: always()
        run: npm run types:check

      - name: Format working tree for scoped diagnostics
        if: always()
        run: npm run check:fix

      - name: Show scoped frontend formatting diff
        if: always()
        run: git diff -- resources/js/pages/transactions/index.tsx resources/js/components/transactions/category-picker.tsx

      - name: Run CI Checks
        run: composer ci:check

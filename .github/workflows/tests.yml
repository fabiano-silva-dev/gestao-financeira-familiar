name: tests

# Valida o domínio financeiro e a qualidade do código antes do merge.

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gestao_financeira_familiar
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gestao_financeira_familiar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: gestao_financeira_familiar
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run financial feature tests
        run: |
          php artisan test tests/Feature/FinancialImportAutoDetectionTest.php
          php artisan test tests/Feature/MonthlyImportClosingTest.php
          php artisan test tests/Feature/FinancialAccountTest.php
          php artisan test tests/Feature/OfxImportTest.php
          php artisan test tests/Feature/CardStatementImportTest.php
          php artisan test tests/Feature/CreditCardInvoicePaymentReconciliationTest.php
          php artisan test tests/Feature/ExpenseRefundTest.php
          php artisan test tests/Feature/FinancialEntryTest.php
          php artisan test tests/Feature/CreditCardInvoiceTest.php
          php artisan test tests/Feature/FinancialRecurrenceTest.php
          php artisan test tests/Feature/DashboardTest.php
          php artisan test tests/Feature/PaymentDashboardTest.php

      - name: Check monthly import closing changes
        run: |
          ./vendor/bin/pint --test app/Http/Controllers/MonthlyImportClosingController.php app/Http/Controllers/FinancialImportController.php app/Models/FinancialPeriodClosure.php app/Models/Workspace.php app/Services/Imports/MonthlyImportClosingService.php tests/Feature/MonthlyImportClosingTest.php routes/web.php database/migrations/2026_09_22_160000_create_financial_period_closures_table.php
          ./vendor/bin/phpstan analyse --no-progress app/Http/Controllers/MonthlyImportClosingController.php app/Http/Controllers/FinancialImportController.php app/Models/FinancialPeriodClosure.php app/Models/Workspace.php app/Services/Imports/MonthlyImportClosingService.php
          ./node_modules/.bin/vp check resources/js/pages/imports/closing.tsx resources/js/pages/imports/index.tsx resources/js/components/imports/imports-navigation.tsx resources/js/types/financial-import.ts
          npm run types:check

      - name: Capture formatted payment dashboard
        run: |
          ./node_modules/.bin/vp fmt resources/js/pages/payments-dashboard.tsx --write
          echo "__PAYMENTS_DASHBOARD_BASE64__"
          base64 -w 0 resources/js/pages/payments-dashboard.tsx
          echo
          echo "__END_PAYMENTS_DASHBOARD_BASE64__"

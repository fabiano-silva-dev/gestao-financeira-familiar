name: format-pr3-once

on:
  push:
    branches:
      - fase-4-recorrencias

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fase-4-recorrencias

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Apply project formatter
        run: npm run check:fix

      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GESTAO_FINANCEIRA_FAMILIAR.md resources/js
          git rm .github/workflows/format-pr3-once.yml
          git commit -m "style: aplica formatação do projeto"
          git push origin HEAD:fase-4-recorrencias

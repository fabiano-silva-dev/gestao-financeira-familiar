name: format-debug

on:
  push:
    branches:
      - tmp/category-format

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - run: npm install
      - name: Format and show diff
        run: |
          npx vp fmt . --write
          git diff -- GESTAO_FINANCEIRA_FAMILIAR.md resources/js/components/categories/category-form.tsx
